; TILEKIT.INI: the palettes TILEKIT starts a new tile set with -- one for
; 256-color sets (8 bits a pixel), one for 16-color sets (4 bits a pixel).
;
; Each section is up to 256 colors, in order from color 0: RRGGBB in hex
; (a # before one is allowed), separated by spaces, commas or new lines.
; Colors not given are the video card's own (xterm's). A ; starts a comment.
; TILEKIT looks for this file in the current directory, then in /CMD.
;
; In a 16-color set the palette is 16 rows of 16: a tile's pixels are 0-15,
; and each place it is put on the map picks the row its colors come from.
; Color 0 of every row shows through (in tiles), whatever it is set to.

